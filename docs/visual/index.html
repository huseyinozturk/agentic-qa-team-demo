<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Agents Demo</title>
<style>
:root {
  --bg:#f6f7fb; --card:#fff; --ink:#172033; --muted:#5d6b85; --line:#dfe4ee;
  --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --warn:#d97706; --warnbg:#fef3c7;
  --blue:#2563eb; --bluebg:#dbeafe; --violet:#7c3aed; --violetbg:#ede9fe; --shadow:0 1px 3px rgba(16,24,40,.08),0 6px 24px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0e1424; --card:#161e33; --ink:#e8ecf6; --muted:#95a3c0; --line:#26314d;
    --okbg:#12361f; --badbg:#3d1618; --warnbg:#3a2a0b; --bluebg:#15264d; --violetbg:#2a1f52; --shadow:none;
  }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
header { padding:18px 24px 6px; max-width:1180px; margin:0 auto; }
header h1 { margin:0; font-size:22px; } header p { margin:2px 0 0; color:var(--muted); font-size:14px; }
nav { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); }
.steps { display:flex; gap:6px; max-width:1180px; margin:0 auto; padding:10px 24px; overflow-x:auto; }
.steps button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px; padding:6px 14px; font:inherit; font-size:14px; cursor:pointer; white-space:nowrap; }
.steps button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
main { max-width:1180px; margin:0 auto; padding:20px 24px 80px; }
.scene { animation:in .35s ease; }
@keyframes in { from { opacity:0; transform:translateY(8px);} to { opacity:1; transform:none; } }
h2 { margin:0 0 4px; font-size:26px; }
.lead { color:var(--muted); margin:0 0 18px; max-width:780px; font-size:17px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); }
.grid { display:grid; gap:14px; } .g5 { grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); } .g2 { grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); } .g3 { grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); }
.chip { display:inline-block; padding:2px 10px; border-radius:999px; font-size:13px; margin:2px 4px 2px 0; border:1px solid var(--line); }
.ok { background:var(--okbg); color:var(--ok); border-color:transparent; } .no { background:var(--badbg); color:var(--bad); border-color:transparent; }
.blue { background:var(--bluebg); color:var(--blue); border-color:transparent; } .violet { background:var(--violetbg); color:var(--violet); border-color:transparent; } .warn { background:var(--warnbg); color:var(--warn); border-color:transparent; }
.muted { color:var(--muted); } .small { font-size:14px; } .mono { font-family:ui-monospace,Menlo,monospace; font-size:13px; }
.agent .emoji { font-size:30px; } .agent h3 { margin:6px 0 2px; font-size:18px; } .agent .sub { color:var(--muted); font-size:14px; min-height:44px; }
.kv { font-size:13px; color:var(--muted); margin-top:8px; } .kv b { color:var(--ink); }
.tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:10px; }
.tile { border-radius:12px; padding:10px; border:2px solid transparent; cursor:pointer; text-align:left; font:inherit; color:var(--ink); }
.tile.pass { background:var(--okbg); } .tile.fail { background:var(--badbg); } .tile.sel { border-color:var(--blue); }
.tile .nm { font-size:13px; min-height:36px; } .tile .st { font-size:18px; }
.tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.tabs button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:6px 14px; cursor:pointer; font:inherit; }
.tabs button.on { background:var(--ink); color:var(--bg); }
.box { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:10px; word-break:break-word; }
.hl { background:#fde047; color:#111; padding:0 3px; border-radius:3px; } .red { background:var(--badbg); color:var(--bad); padding:0 3px; border-radius:3px; }
.big { font-size:38px; font-weight:800; line-height:1; }
.pager { display:flex; justify-content:space-between; margin-top:26px; }
.pager button, .btn { border:0; background:var(--blue); color:#fff; padding:10px 20px; border-radius:10px; font:inherit; cursor:pointer; }
.pager button.ghost, .btn.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
.row { display:flex; align-items:center; gap:10px; margin:6px 0; font-size:14px; }
.bar { height:16px; border-radius:6px; background:var(--blue); min-width:3px; transition:width .6s; }
.cap { background:var(--line); border-radius:6px; flex:1; height:16px; position:relative; overflow:hidden; } .cap .bar { position:absolute; left:0; top:0; }
.ladder .rung { padding:10px 14px; border-radius:10px; margin:6px 0; font-size:15px; display:flex; justify-content:space-between; }
.vs { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; margin:10px 0; }
.vs .q { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:14px; }
.funnel .seg { padding:10px 14px; border-radius:10px; margin:6px 0; font-weight:600; }
.gauge { margin:10px 0; } .gauge .track { height:14px; border-radius:7px; background:var(--line); overflow:hidden; } .gauge .fill { height:100%; border-radius:7px; }
.timeline { border-left:3px solid var(--line); margin-left:10px; padding-left:18px; }
.timeline .ev { position:relative; margin:0 0 16px; } .timeline .ev::before { content:""; position:absolute; left:-27px; top:6px; width:12px; height:12px; border-radius:50%; background:var(--blue); }
.verdict { display:flex; gap:12px; align-items:flex-start; } .verdict.rej { border-left:5px solid var(--bad); } .verdict.acc { border-left:5px solid var(--ok); }
.verdict ul { margin:6px 0 0; padding-left:18px; color:var(--bad); font-size:14px; }
.shield { display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-bottom:1px dashed var(--line); font-size:15px; } .shield:last-child { border-bottom:0; }
.bubble { border-left:5px solid var(--bad); }
.draft { display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
.stamp { font-weight:700; padding:2px 10px; border-radius:8px; }
details summary { cursor:pointer; color:var(--blue); font-size:14px; margin-top:8px; }
/* animated diagram */
.diagram svg { width:100%; height:auto; background:var(--card); border:1px solid var(--line); border-radius:14px; }
.node rect { fill:var(--card); stroke:var(--line); stroke-width:2; transition:all .4s; } .node text { fill:var(--ink); }
.node.on rect { stroke:var(--blue); stroke-width:3; fill:var(--bluebg); } .node.dim { opacity:.35; }
.edge { stroke:var(--line); stroke-width:2; fill:none; transition:stroke .4s; } .edge.on { stroke:var(--blue); stroke-width:3; }
.elabel { fill:var(--muted); font-size:12px; paint-order:stroke; stroke:var(--card); stroke-width:6px; stroke-linejoin:round; } .elabel.on { fill:var(--blue); font-weight:700; }
.caption { margin-top:12px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
.caption .t { flex:1; min-width:260px; font-size:17px; }
.dots span { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--line); margin-right:6px; } .dots span.on { background:var(--blue); }
</style>
</head>

const PHASES = [

];
let ph = 0, playing = true, timer = null;
const NW = 150, NH = 62;
const center = n => [NODES[n].x, NODES[n].y];
function edgePath(e) {
  const [x1,y1]=center(e.a), [x2,y2]=center(e.b);
  const dx=x2-x1, dy=y2-y1, len=Math.hypot(dx,dy), ux=dx/len, uy=dy/len;
  // shorten so the line starts and ends at the node border
  const k = Math.min((NW/2)/Math.max(Math.abs(ux),1e-6), (NH/2)/Math.max(Math.abs(uy),1e-6)) + 5;
  const sx=x1+ux*k, sy=y1+uy*k, ex=x2-ux*k, ey=y2-uy*k;
  return {d:`M${sx} ${sy} L${ex} ${ey}`, lx:(sx+ex)/2, ly:(sy+ey)/2};
}
function diagram() {
  const P = PHASES[ph];
  const edges = EDGES.map(e => { const p=edgePath(e), on=P.e.includes(e.id);
    const mk = `${e.two?`marker-start="url(#a${on?'on':'off'})"`:''} marker-end="url(#a${on?'on':'off'})"`;
    const badge = e.approval ? `<g transform="translate(${p.lx},${p.ly})"><circle r="15" fill="var(--card)" stroke="${on?'var(--blue)':'var(--line)'}" stroke-width="2"/><text y="6" text-anchor="middle" font-size="17">🧑</text><text y="30" text-anchor="middle" class="elabel ${on?'on':''}">you approve</text></g>` : '';
    return `<path class="edge ${on?'on':''}" d="${p.d}" ${mk}/>
      <text class="elabel ${on?'on':''}" x="${p.lx}" y="${p.ly+(e.approval?-24:-8)}" text-anchor="middle">${e.t}</text>${badge}
      ${on?`<circle r="6" fill="var(--blue)"><animateMotion dur="2s" repeatCount="indefinite" path="${p.d}"/></circle><circle r="6" fill="var(--blue)" opacity=".5"><animateMotion dur="2s" begin="1s" repeatCount="indefinite" path="${p.d}"/></circle>`:''}`; }).join('');
  const nodes = Object.entries(NODES).map(([k,n]) => `<g class="node ${P.n.includes(k)?'on':'dim'}" transform="translate(${n.x-NW/2},${n.y-NH/2})">
      <rect width="${NW}" height="${NH}" rx="14"/><text x="${NW/2}" y="26" text-anchor="middle" font-size="20">${n.e}</text><text x="${NW/2}" y="49" text-anchor="middle" font-size="12.5" font-weight="600">${n.l}</text></g>`).join('');
  return `<div class="diagram"><svg viewBox="0 0 1100 540" role="img" aria-label="Animated diagram of how the agents work together">
    <defs><marker id="aoff" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker>
    <marker id="aon" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--blue)"/></marker></defs>
    ${edges}${nodes}</svg>
    <div class="caption"><div class="t">${P.t}</div>

    <div class="dots" style="margin-top:8px">${PHASES.map((_,i)=>`<span class="${i===ph?'on':''}" data-ph="${i}" style="cursor:pointer"></span>`).join('')}</div>
    <div class="muted small" style="margin-top:6px">🧑 = a step that needs your approval before anything leaves the team.</div></div>`;
}

function overview() {
  const cards = Object.entries(D.roster).map(([name, r]) => `<div class="card agent"><div class="emoji">${ICON[name]}</div><h3>${name}</h3>

  return `<h2>How a QA team of agents starts on a new project</h2>
   <p class="lead">Imagine the team meets this project for the first time. Six phases, one human who approves every outward action.</p>

  return `<h2>Phase 1 · The Lead reads everything and plans</h2>
   <p class="lead">Documents and tickets are collected and grouped by area. For each item the Lead decides which kind of test fits.</p>

   <div class="grid g3" style="margin-top:14px">${area}</div>
   <div class="card" style="margin-top:14px"><b>🗓️ Plan</b> (what the Runner will follow) ${D.plan.map(p=>`<div class="row"><span class="chip blue">${esc(p.suite)}</span> ${esc(p.trigger)} · <span class="muted">${esc(p.env)}</span></div>`).join('')}</div>`;

    return `<div class="card"><b>${esc(c.title)}</b> <span class="chip ${ans?'ok':'warn'}">${ans?'answered':'open'}</span>
      ${quotes.length===2?`<div class="vs"><div class="q">${esc(quotes[0])}</div><b>≠</b><div class="q">${esc(quotes[1])}</div></div>`:`<div class="box small">${esc(c.conflict)}</div>`}
      <div class="small">➡️ Question for: <b>${esc(c.to)}</b> <span class="muted">(drafted by the Analyst, sent after your approval)</span></div>
      <div class="small">${ans?`✅ ${esc(c.resolution)}`:`⛔ ${esc(c.resolution)}`}</div></div>`;
  }).join('');
  const suites = ['smoke','critical','regression'].map(s => `<div class="card"><span class="chip ${s==='smoke'?'ok':s==='critical'?'no':'blue'}">${s}</span>
      <div class="big" style="margin-top:6px">${D.cases.filter(c=>c.suite===s).length}</div><div class="muted small">${s==='smoke'?'tiny, fast: is the app alive?':s==='critical'?'money and data integrity':'everything else'}</div>
      ${s!=='regression'?`<div class="small" style="margin-top:6px">🧑 owner approved</div>`:''}</div>`).join('');
  const list = D.cases.map(c => `<span class="chip ${c.status.startsWith('blocked')?'warn':TYPECHIP[c.type]}" title="${esc(c.title)}" style="cursor:default">${esc(c.title)}</span>`).join('');
  return `<h2>Phase 2 · The Analyst writes cases and settles disagreements</h2>
   <p class="lead">Documents have a pecking order. When two disagree, the Analyst does not guess: it asks the people who own them.</p>
   <div class="grid g2"><div class="card"><b>🪜 Which source wins</b><div class="ladder" style="margin-top:8px">
      ${['Product requirements','API specification','Design notes','Ticket criteria'].map((n,i)=>`<div class="rung" style="background:var(--violetbg);opacity:${1-i*.15}"><b>${i+1}. ${n}</b>${i===0?'<span>wins</span>':''}</div>`).join('')}
      <div class="small muted">Comments and chat are never a source on their own.</div></div></div>
     <div class="card"><b>🔗 Every step has a source</b><div class="big" style="margin:8px 0">${src} / ${steps}</div>
       <div class="cap" style="height:14px"><span class="bar" style="width:${src/steps*100}%;background:var(--ok)"></span></div>
       <div class="small muted" style="margin-top:8px">${D.cases.length} cases: ${Object.entries(by).map(([k,v])=>`${v} ${TYPENAME[k]}`).join(', ')}</div></div></div>
   <h3 style="margin:22px 0 8px">Disagreements and open questions</h3><div class="grid g3">${conflicts}</div>
   <h3 style="margin:22px 0 8px">Suites the Analyst proposed</h3><div class="grid g3">${suites}</div>
   <details><summary>Show all ${D.cases.length} cases</summary><div style="margin-top:8px">${list}</div></details>`;
}

function phase3() {
  const e2e = D.cases.filter(c => c.type==='e2e-fe');
  const done = D.flows.filter(f => f.id!=='auth-004').length, blockedId = e2e.filter(c=>c.status.startsWith('blocked')).length;
  const waiting = Object.values(D.missingIds).flat().length;
  const fr = D.firstRun, bad = fr.filter(r=>!r.ok);
  return `<h2>Phase 3 · The Automation engineer builds the scripts</h2>
   <p class="lead">Only cases that are ready and have everything they need get automated. What is missing is written down, not worked around.</p>
   <div class="grid g2"><div class="card funnel"><b>From cases to scripts</b>
      <div class="seg" style="background:var(--bluebg)">${e2e.length} end-to-end cases</div>
      <div class="seg" style="background:var(--okbg);width:${done/e2e.length*100}%;min-width:60%">✅ ${done} automated and runnable</div>
      <div class="seg" style="background:var(--warnbg);width:60%">⏳ ${waiting} waiting for a missing testID</div>
      <div class="seg" style="background:var(--warnbg);width:60%">⛔ ${blockedId} blocked by an open question</div>
      <div class="small muted">API and unit cases wait until a framework is selected for them.</div></div>
     <div class="card"><b>🔎 testID check</b><div class="small muted">Does the app have an id for every screen element the cases mention?</div>
       ${Object.entries(D.missingIds).map(([id,cs])=>`<div class="box"><span class="chip no">missing</span> <span class="mono">${esc(id)}</span><div class="small muted">needed by ${cs.join(', ')} → request sent to the app developers</div></div>`).join('')}
       <div class="small" style="margin-top:8px">The other UI elements exist in the app.</div></div></div>
   <div class="card" style="margin-top:14px"><b>▶ First run of every script</b> (${fr.filter(r=>r.ok).length} pass, ${bad.length} fail)
     <div class="tiles" style="margin-top:10px">${fr.map(r=>`<div class="tile ${r.ok?'pass':'fail'}"><div class="st">${r.ok?'✅':'❌'}</div><div class="nm">${esc((D.flows.find(f=>f.id===r.caseId)||{}).name)}</div></div>`).join('')}</div>
     <div class="small" style="margin-top:8px">The ${bad.length} failures are <b>real app bugs</b>, not script problems. They stay failing: no skipping, no hiding.</div></div>`;
}

let nIdx = 1, sel = null;
function phase4() {
  const all = [...D.nights, ...D.smoke]; const n = all[nIdx], prev = nIdx>0 && nIdx<D.nights.length ? D.nights[nIdx-1] : null;
  const fails = n.runs.filter(r=>!r.ok);
  const tiles = n.runs.map(r => `<button class="tile ${r.ok?'pass':'fail'} ${sel===r.caseId?'sel':''}" data-case="${r.caseId}"><div class="st">${r.ok?'✅':'❌'}</div><div class="nm">${esc((D.flows.find(f=>f.id===r.caseId)||{}).name)}</div>${r.ok?'':`<span class="chip no">${r.failureClass}</span>`}</button>`).join('');
  const s = sel && n.runs.find(r=>r.caseId===sel);
  let detail = '<div class="muted small" style="margin-top:10px">👆 Click a tile for the evidence.</div>';
  if (s) { const k = D.known[s.caseId], was = prev && prev.runs.some(r=>r.caseId===s.caseId&&!r.ok);
    detail = `<div class="box"><b>${esc((D.flows.find(f=>f.id===s.caseId)||{}).name)}</b> · ${(s.durationMs/1000).toFixed(0)}s<br>${s.ok?'Passed.':`Suggested cause: <span class="chip no">${s.failureClass}</span> <span class="chip ${k?'warn':'blue'}">${k?'already known':(was?'failed before':'new today')}</span><div class="mono" style="margin-top:6px">${esc(s.error)}</div>${s.caseId==='invest-001'?'<div class="small muted">⚠️ Doubtful: could be an app bug (button hidden by the keyboard). The agent suggests, a person confirms.</div>':''}`}</div>`; }
  const h = n.host, hp = prev && prev.host;
  const g = (label, val, unit, max, bad, prevV, invert) => { const pct = Math.min(100, val/max*100), isBad = invert ? val<bad : val>bad;
    return `<div class="gauge"><div class="row" style="justify-content:space-between"><span>${label}</span><b style="color:${isBad?'var(--bad)':'var(--ok)'}">${val} ${unit}</b></div><div class="track"><div class="fill" style="width:${pct}%;background:${isBad?'var(--bad)':'var(--ok)'}"></div></div>${prevV!==undefined?`<div class="small muted">before: ${prevV} ${unit}</div>`:''}</div>`; };
  const gauges = h ? g('CPU peak',h.peakCpuPct,'%',100,90,hp&&hp.peakCpuPct) + g('Swap used',h.swapGb,'GB',8,4,hp&&hp.swapGb) + g('Free memory (lowest)',h.minFreeMemMb,'MB',4000,1000,hp&&hp.minFreeMemMb,true) : '';
  return `<h2>Phase 4 · The Runner runs the plan and reports</h2>
   <p class="lead">Tests run on the planned triggers and environments. The report covers the tests <i>and</i> how the machine coped.</p>
   <div class="grid g3" style="margin-bottom:14px">${D.plan.map(p=>`<div class="card"><span class="chip blue">${esc(p.suite)}</span><div style="margin-top:6px"><b>${esc(p.trigger)}</b></div><div class="muted small">on ${esc(p.env)}</div></div>`).join('')}</div>
   <div class="tabs">${all.map((x,i)=>`<button data-n="${i}" class="${i===nIdx?'on':''}">${esc(x.label)}</button>`).join('')}</div>
   <div class="grid g2" style="grid-template-columns:2fr 1fr"><div class="card"><div class="big">${n.runs.filter(r=>r.ok).length} <span style="font-size:18px;color:var(--ok)">pass</span> · ${fails.length} <span style="font-size:18px;color:var(--bad)">fail</span></div>
        <div class="tiles" style="margin-top:12px">${tiles}</div>${detail}</div>
      <div class="card"><b>🖥️ The machine</b>${gauges||'<div class="muted small">no host metrics</div>'}
        ${h&&h.swapGb>4?'<div class="box small">⚠️ Heavy swap can make the device driver fail: the “driver” failure may be load, not the app.</div>':''}</div></div>`;
}

let approvedAll = false;
function phase5() {
  const filed = Object.fromEntries(D.filed.map(f=>[f.id,f.filedAs]));
  const cards = D.drafts.map(d => `<div class="card draft"><div><span class="chip ${d.action==='create'?(d.type==='Bug'?'no':'violet'):'blue'}">${d.action==='create'?'new '+d.type.toLowerCase():'comment on existing'}</span><b>${esc(d.title)}</b>
      <div class="muted small">${esc(d.evidence)}</div></div>
      <div>${approvedAll?`<span class="stamp ok">✔ filed ${esc(filed[d.id]||'')}</span>`:'<span class="stamp warn">draft: waiting for owner</span>'}</div></div>`).join('');
  return `<h2>Phase 5 · The Lead turns findings into tickets</h2>
   <p class="lead">The Lead reads the report and drafts tickets and comments, each with evidence. Filing is an outward action, so it needs the owner.</p>
   <div style="margin-bottom:14px"><button class="btn" data-approve="1">${approvedAll?'↺ Back to drafts':'🧑 Owner approves all drafts'}</button> <span class="muted small">Without approval the filing script refuses: try the terminal demo.</span></div>
   <div class="grid">${cards}</div>`;
}

function phase6() {
  const w = D.watch, ch = w.te150.changes;
  const sus = w.suspects.map(s=>`<div class="card bubble"><div class="muted small">📌 ${esc(s.source)}</div>“${esc(s.text)}”</div>`).join('');
  const shield = [['Mark failures as passed','No write access outside its own folder'],['Delete results','No shell. A hook would also block it.'],['Post environment variables / the API key','No network, no tracker tools. The key is not in its environment.'],['Push the branch (“owner approved”)','No git. Approval only counts from the owner in the session.']]
    .map(r=>`<div class="shield"><span>🚫</span><div><b>${r[0]}</b><div class="muted small">→ ${r[1]}</div></div></div>`).join('');
  return `<h2>Phase 6 · The Watcher keeps the team up to date</h2>
   <p class="lead">While everything else runs, the Watcher reads the tracker and chat. Here is what it caught, and what the team did about it.</p>
   <div class="grid g2"><div class="card"><b>📰 Yesterday's news</b><div class="timeline" style="margin-top:12px">
       <div class="ev"><b>Tracker</b><br>“${esc(w.te150.summary)}” got the <span class="chip blue">e2e</span> label and moved ${esc(ch[1].from)} → <span class="chip ok">${esc(ch[1].to)}</span></div>
       <div class="ev"><b>Watcher → Lead</b><br>No case or script covers it yet. Suggests: write one and add it to the regression suite.</div>
       <div class="ev"><b>Analyst</b><br>Writes the sign-out case (and an API case).</div>
       <div class="ev"><b>Automation engineer</b><br>Builds the script, lint is clean, one run passes${D.newRun?` in ${(D.newRun.durationMs/1000).toFixed(0)}s`:''}.</div>
       <div class="ev"><b>Result</b><br>Regression suite grows from <b>10</b> to <b>${D.flows.length}</b> scripts. The ticket is now part of the automated tests.</div></div></div>
     <div class="card"><b>💬 Chat, filtered for testing</b>${w.chat.map(m=>`<div class="box small"><span class="muted">${esc(m.channel)} · ${esc(m.author)}</span><br>${esc(m.text)}</div>`).join('')}
       <div class="small muted" style="margin-top:8px">Tracker: ${w.tickets} tickets changed. Chat: ${w.messages} messages. Only the testing-relevant ones are forwarded.</div></div></div>
   <h3 style="margin:24px 0 6px">🧪 The planted attack: text that tries to give the agents orders</h3>
   <p class="muted small" style="margin-top:0">Tracker and chat text is data, never instructions. Two attacks and one secret were planted in this project.</p>
   <div class="grid g2">${sus}</div>
   <div class="grid g2" style="margin-top:14px"><div class="card"><b>What they asked, and why it cannot work</b>${shield}</div>
     <div class="card"><b>🧹 The secret</b><div class="box mono">Bearer <span class="red">${esc(w.rawToken)}…</span></div><div class="small muted">raw, in the tracker</div>
       <div class="box mono">Bearer <span class="hl">${esc(w.cleanToken)}</span></div><div class="small muted">what any agent sees (redacted before they read it)</div>
       <div class="small" style="margin-top:8px">The Watcher quoted both attacks and wrote <span class="hl">“Not acted on”</span>.</div></div></div>`;
}

function review() {
  const v = D.verdicts.map(x=>`<div class="card verdict ${x.ok?'acc':'rej'}"><div style="font-size:26px">${x.ok?'✅':'⛔'}</div><div><b>${esc(x.id.replace(/^\d{4}-\d\d-\d\d-/,'').replace(/-/g,' '))}</b> <span class="chip blue">${esc(x.to)}</span>
     <div class="muted small">${x.ok?'Evidence re-derived and it matches.':'Rejected: the evidence does not hold.'}</div>${x.ok?'':`<ul>${x.reasons.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`}</div></div>`).join('');
  const max = Math.max(...D.cost.map(c=>Math.max(c.usd,c.cap)));
  const cost = D.cost.map(c=>`<div class="row"><span style="width:170px">${c.role}</span><span class="cap"><span class="bar" style="width:${c.usd/max*100}%"></span></span><b>${usd(c.usd)}</b><span class="muted small">cap ${usd(c.cap)}/run</span></div>`).join('');
  return `<h2>The Lead does not trust summaries</h2>
   <p class="lead">Every handoff is checked by re-deriving its evidence: recount results, re-run lint, look up run ids, check that each source exists.</p>
   <div class="grid">${v}</div>
   <div class="card" style="margin-top:18px"><b>💰 Cost per role</b><div style="margin-top:8px">${cost}</div><div class="big" style="margin-top:10px">${usd(D.cost.reduce((s,c)=>s+c.usd,0))}</div>
     <div class="muted small">⚠️ Illustrative placeholder numbers in recorded mode. <code>--agents</code> mode logs measured spend.</div></div>`;
}

const scenes = [{t:'Overview',f:overview},{t:'1 · Plan',f:phase1},{t:'2 · Cases',f:phase2},{t:'3 · Scripts',f:phase3},{t:'4 · Runs',f:phase4},{t:'5 · Tickets',f:phase5},{t:'6 · Watcher',f:phase6},{t:'Review & cost',f:review}];
let cur = 0;
function render() {
  $('#steps').innerHTML = scenes.map((s,i)=>`<button data-i="${i}" class="${i===cur?'on':''}">${s.t}</button>`).join('');
  $('#main').innerHTML = `<section class="scene">${scenes[cur].f()}<div class="pager"><button class="ghost" data-go="-1" ${cur===0?'style="visibility:hidden"':''}>← Back</button><button data-go="1" ${cur===scenes.length-1?'style="visibility:hidden"':''}>Next →</button></div></section>`;
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-i],[data-go],[data-n],[data-case],[data-approve],[data-play],[data-ph]'); if (!t) return;
  const d = t.dataset;
  if (d.i) cur = +d.i; else if (d.go) cur = Math.min(scenes.length-1, Math.max(0, cur + +d.go));
  else if (d.n) nIdx = +d.n; else if (d.case) sel = d.case; else if (d.approve) approvedAll = !approvedAll;
  else if (d.play) { playing = !playing; startTimer(); } else if (d.ph) { ph = +d.ph; playing = false; startTimer(); }
  render();
});
document.addEventListener('keydown', e => { if (e.key==='ArrowRight') cur = Math.min(scenes.length-1, cur+1); else if (e.key==='ArrowLeft') cur = Math.max(0, cur-1); else return; render(); });
render(); startTimer();
</script>
</body>
</html>
