# Shared subflow: sign in with the mock OTP. Not a test case (no header required).
appId: com.example.tokenestate
---
- launchApp:
    clearState: true
- tapOn:
    id: "email-input"
- inputText: "demo@example.test"
- tapOn:
    id: "send-otp-button"
- extendedWaitUntil:
    visible:
      id: "otp-delivered-banner"
    timeout: 10000
- tapOn:
    id: "otp-input"
- inputText: "123456"
- tapOn:
    id: "verify-otp-button"
- assertVisible:
    id: "tab-wallet"
